<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3b2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Game" />
    <title>Where's My Game</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="src/App.css?v=20261007d" />
  </head>
  <body>
    <div id="root">Loading Where's My Game…</div>
    <script type="module" src="src/phone.js"></script>
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && root.textContent.indexOf("Loading") === 0) {
          root.textContent = "Could not load. Close this tab and open the link again.";
        }
      });
    </script>
  </body>
</html>
